services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-pagos-externos
    ports:
      - "5672:5672"   # puerto que usa la app para conectarse (AMQP)
      - "15672:15672" # panel web de administracion -> http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
