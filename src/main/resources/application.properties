# --- Conexion a tu MariaDB local de AQUORA ---
spring.datasource.url=jdbc:mariadb://localhost:3306/oficina_agua_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- RabbitMQ (levantado con docker-compose.yml) ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.queue=pagos.envio.queue
app.rabbitmq.exchange=pagos.envio.exchange
app.rabbitmq.routing-key=pagos.envio
# DLQ: donde caen los mensajes no reintentables (400/403/409 IDEMPOTENCY_KEY_REUSED/422)
app.rabbitmq.dlq=pagos.envio.dlq
app.rabbitmq.dlx=pagos.envio.dlx

# --- API del banco (sustituir con los valores reales que entregue el profe) ---
# La API key real NUNCA se sube al repo: en Windows, definela como variable de
# entorno de usuario (BANK_API_KEY) o pasala con -D al correr mvn spring-boot:run.
app.bank.base-url=${BANK_BASE_URL:https://REEMPLAZAR_API_ID.execute-api.us-east-1.amazonaws.com/prod}
app.bank.api-key=${BANK_API_KEY:cambiar-en-local}
app.bank.team-code=${TEAM_CODE:EQUIPO_A}

# AJUSTA esta propiedad si el @FeignClient generado espera otro nombre
# (revisa la anotacion en target/generated-sources/openapi-bank/.../BankApi.java)
bankpaymentssimulator.base-url=${app.bank.base-url}

spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# Nunca exponer stack traces en las respuestas
server.error.include-stacktrace=never

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html

server.port=8083
