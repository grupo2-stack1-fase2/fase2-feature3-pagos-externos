# --- Conexion a tu MariaDB local de AQUORA ---
# Ajusta el nombre de la base de datos si en tu Laragon se llama distinto
spring.datasource.url=jdbc:mariadb://localhost:3306/oficina_agua_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- RabbitMQ (levantado con docker-compose.yml) ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.queue=pagos.envio.queue
app.rabbitmq.exchange=pagos.envio.exchange
app.rabbitmq.routing-key=pagos.envio

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html

server.port=8083
